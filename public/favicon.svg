<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="咕咕奇遇记">
  <!-- 底：青蓝 -->
  <rect width="64" height="64" rx="14" fill="#1B7A8C"/>
  <!-- 米白内圈 -->
  <circle cx="32" cy="33" r="21" fill="#F5EBDC" opacity="0.16"/>
  <!-- 泥咕咕：墨黑鸟身 -->
  <ellipse cx="32" cy="37" rx="15" ry="13" fill="#211A18"/>
  <!-- 头部 -->
  <circle cx="32" cy="23" r="9" fill="#211A18"/>
  <!-- 黄喙 -->
  <path d="M32 24.5 L41 27 L32 29.5 Z" fill="#F2C230"/>
  <!-- 红脸颊 -->
  <circle cx="27" cy="26" r="3.2" fill="#D8382F"/>
  <!-- 眼睛 -->
  <circle cx="33" cy="21.5" r="1.6" fill="#F5EBDC"/>
  <!-- 青蓝翅膀 -->
  <path d="M18 33 q9 -6 15 1 q-6 9 -15 6 Z" fill="#1B7A8C"/>
  <path d="M46 33 q-9 -6 -15 1 q6 9 15 6 Z" fill="#1B7A8C"/>
  <!-- 红花 -->
  <circle cx="45.5" cy="17" r="3.4" fill="#D8382F"/>
  <circle cx="45.5" cy="17" r="1.3" fill="#F2C230"/>
  <!-- 脚 -->
  <path d="M26 48 l0 4 M32 49 l0 4 M38 48 l0 4" stroke="#F2C230" stroke-width="2.2" stroke-linecap="round"/>
</svg>
